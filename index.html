<!doctype html>
<html lang="en" data-theme="carbon">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Caoqu's AI engineering portfolio, served through a skill-driven workflow.">
  <title>Caoqu / AI Engineering Portfolio</title>
  <link rel="stylesheet" href="style.css?v=20260924-2">
</head>
<body>
  <main class="terminal" id="terminal" aria-label="Caoqu portfolio terminal">
    <header class="terminal-bar">
      <div class="window-actions" aria-label="Terminal window actions">
        <button class="window-action action-clear" type="button" data-window-action="clear" aria-label="Clear output" title="Clear output"></button>
        <button class="window-action action-collapse" type="button" data-window-action="collapse" aria-label="Collapse output" title="Collapse output"></button>
        <button class="window-action action-expand" type="button" data-window-action="expand" aria-label="Expand output" title="Expand output"></button>
      </div>
      <p class="terminal-title">caoqu@portfolio / skill console</p>
      <div class="terminal-tools">
        <p class="terminal-status" id="terminal-status" aria-live="polite">booting</p>
        <div class="theme-picker" id="theme-picker">
          <button class="theme-trigger" id="theme-trigger" type="button"
            aria-haspopup="menu" aria-expanded="false" aria-label="Choose terminal theme"
            title="Terminal theme: Carbon">
            <span class="theme-trigger-swatch" aria-hidden="true"></span>
          </button>
          <div class="theme-menu" id="theme-menu" role="menu"
            aria-label="Terminal themes" aria-hidden="true">
            <button type="button" role="menuitemradio" aria-checked="true" data-theme-option="carbon">
              <span class="theme-swatch swatch-carbon" aria-hidden="true"></span><span>Carbon</span>
            </button>
            <button type="button" role="menuitemradio" aria-checked="false" data-theme-option="matrix">
              <span class="theme-swatch swatch-matrix" aria-hidden="true"></span><span>Matrix</span>
            </button>
            <button type="button" role="menuitemradio" aria-checked="false" data-theme-option="amber">
              <span class="theme-swatch swatch-amber" aria-hidden="true"></span><span>Amber</span>
            </button>
            <button type="button" role="menuitemradio" aria-checked="false" data-theme-option="solarized">
              <span class="theme-swatch swatch-solarized" aria-hidden="true"></span><span>Solarized</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <section class="terminal-output" id="terminal-output" aria-live="polite" aria-label="Command output"></section>

    <footer class="terminal-footer">
      <div class="slash-palette" id="slash-palette" hidden>
        <p class="palette-label">Available commands</p>
        <div id="slash-options" role="listbox" aria-label="Available commands"></div>
      </div>

      <ol class="command-queue" id="command-queue" role="status"
        aria-live="polite" aria-label="等待执行的消息" hidden></ol>

      <form class="command-line" id="command-form" autocomplete="off">
        <label class="sr-only" for="command-input">Command or question</label>
        <span class="prompt" aria-hidden="true">caoqu@portfolio:~$</span>
        <span class="command-input-shell">
          <input id="command-input" name="command" type="text" maxlength="2000"
            placeholder="/ or ask anything" spellcheck="false"
            autocapitalize="off" aria-controls="slash-palette" aria-expanded="false">
          <span class="idle-caret" aria-hidden="true"></span>
        </span>
      </form>

      <nav class="command-nav" aria-label="Portfolio commands">
        <button type="button" data-command="/help">/help</button>
        <button type="button" data-command="/whoami">/whoami</button>
        <div class="skills-menu" id="skills-menu">
          <button type="button" id="skills-trigger" aria-haspopup="menu" aria-expanded="false">skills</button>
          <div class="skills-popover" role="menu" aria-label="Skills commands" aria-hidden="true">
            <button type="button" role="menuitem" data-command="/works">/works</button>
            <button type="button" role="menuitem" data-command="/jobs">/jobs</button>
          </div>
        </div>
        <button type="button" data-command="/timeline">/timeline</button>
        <button type="button" data-command="/contact">/contact</button>
      </nav>
    </footer>
  </main>

  <noscript>This portfolio needs JavaScript to run its public workflow.</noscript>
  <script src="site-config.js?v=20260923-3"></script>
  <script src="media-map.js?v=20260923-3"></script>
  <script src="content-snapshot.js?v=20260923-3"></script>
  <script src="portfolio-core.js?v=20260924-4"></script>
  <script src="main.js?v=20260924-2"></script>
</body>
</html>
