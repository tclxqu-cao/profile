  <!-- ======= 内容源：命令的输出全部从这里 clone =======
       <template> 是惰性的：不渲染、图也不发请求。所以「案例正文写在 HTML 里、
       终端只是把它搬进屏」这件事，不用拿「页面上摊一整屏长文」去换。
       改文案不用碰 main.js，终端也就没法反过来讲一套假话。 -->
  <template id="sec-whoami">
    <p class="t-lead">白天我在一家在线旅行平台做客服与工单方向的工程，工作是把 AI 接进真实的业务流程，同时守住它的质量底线；下班后我维护一套自己的 AI 工程小生态——一个编排画布、两个零依赖的小站、一个给 4 岁孩子做的全栈启蒙站，和一个越写越长的知识库。</p>
    <p class="t-lead">技术选型偏好很一致：免构建、单机能跑、依赖越少越好。没有 <code>node_modules</code>，就没有供应链风险，也不会有人打开一个页面要等三秒转圈。宁可手写一个着色器，也不想为一个渐变去装两百个包。</p>
    <p class="t-quote">模型的天花板一直在涨，<br />但产品的地板得有人铺。</p>
  </template>

  <template id="sec-skills">
    <h2 class="t-h2">能力。<span>都长在项目上。</span></h2>
    <ul class="t-ul">
      <li><b>Agent 编排与运行时</b><span>Flow Studio 的 21 种节点：LLM、Agent、意图分流、条件、模板、HTTP、知识库、记忆、技能、MCP、工具、视频分镜。条件表达式跑在受限 AST 沙箱里，只允许比较、布尔、算术和点号取值，直接拒绝函数调用与属性逃逸。</span></li>
      <li><b>质量与可靠性</b><span>223 个测试用例覆盖引擎分支、防环、降级和整套 API。但我更信真实链路：把服务起起来、浏览器打开、亲手点一遍，往往比一片绿色的 mock 测试更早发现问题。</span></li>
      <li><b>零依赖前端</b><span>不装包也能做动效：原生 JS 写的 SVG 贝塞尔连线画布、Canvas 动画引擎、手写的 WebGL 着色器。构建步骤为零，部署就是拷文件。</span></li>
      <li><b>抓取与数据分析</b><span>job_agent 适配多家招聘站点，逐日快照进 SQLite，做趋势分析与 0–100 匹配评分。没凭据、没网、没 key 的时候，用种子数据也能把全链路跑通。</span></li>
      <li><b>设计与审美</b><span>留白、层次、秩序感。克制是一种力量，每一个微交互都得说得出自己为什么在这里。</span></li>
    </ul>
    <p class="t-dim">Python · FastAPI · pytest · WebGL · SQLite · 端到端真实链路验收</p>
  </template>

  <template id="sec-stats">
    <h2 class="t-h2">数字。<span>旁边写了怎么量的。</span></h2>
    <dl class="t-cols t-nums">
      <dt class="t-hl"><span class="stat-num" data-target="21">0</span></dt>
      <dd>种编排节点类型<span class="t-by">grep -c NODE_KIND engine/nodes.py</span></dd>
      <dt class="t-hl"><span class="stat-num" data-target="223">0</span></dt>
      <dd>个自动化测试用例<span class="t-by">pytest --collect-only -q</span></dd>
      <dt class="t-hl"><span class="stat-num" data-target="696">0</span></dt>
      <dd>篇结构化知识沉淀<span class="t-by">find wiki -name '*.md' | wc -l</span></dd>
      <dt class="t-hl"><span class="stat-num" data-target="16">0</span></dt>
      <dd>个持续跟踪的项目<span class="t-by">sqlite3 job_agent.db 'select count(*) from projects'</span></dd>
    </dl>
    <p class="t-dim">数字会过期，命令不会——改数之前先把命令重跑一遍。</p>
  </template>

  <template id="sec-timeline">
    <h2 class="t-h2">轨迹。<span>按时间，不按职级。</span></h2>
    <ul class="t-tl">
      <li><span class="t-year">2026 · 09</span><b>Flow Studio 从画布长成平台</b><p>在编排引擎之上补齐记忆、技能、知识库、MCP 客户端、评测与可观测，节点类型扩到 21 种；画布仍然是零构建单页，Pointer Events 一套代码同时吃鼠标和触摸。</p></li>
      <li><span class="t-year">2026 · 09</span><b>两个零依赖小站上线</b><p>美图工坊把滤镜、美颜、裁剪、涂鸦、贴纸全塞进浏览器本地跑；Vibe馆 用 Python 标准库撑起一个带审核队列的作品社区，前端一个包都不装。</p></li>
      <li><span class="t-year">2026 · 08</span><b>读源码：开源 Agent Runtime</b><p>把 DeepSeek 开源的 Agent Harness 拆开看——插件化的运行时容器、追加式会话事件日志、provider-neutral 的模型层和统一 Tool Runtime，落成一组架构笔记。</p></li>
      <li><span class="t-year">2026 · 06</span><b>给 4 岁孩子做一个地球启蒙站</b><p>小小地球侦探队：不认字也能玩。Canvas 场景分章播放、语音朗读、点大图案答题，答对有庆祝动效；后来又长出一套 three.js 小游戏模式。六套课程、39 个章节。</p></li>
      <li><span class="t-year">2026 · 05</span><b>开始把一切写进知识库</b><p>踩过的坑、验过的链路、读过的源码，全部结构化成带来源与置信度的 Markdown 笔记。从此排查同一个问题不用翻聊天记录——现在 696 篇。</p></li>
    </ul>
  </template>

  <template id="sec-contact">
    <h2 class="t-h2">下一步。<span>一起做点酷的。</span></h2>
    <p class="t-lead">无论是有意思的项目、值得聊的想法，还是一份新机会，都欢迎来找我。代码都在 Gitee 上，想聊具体实现，直接开 issue 也行。</p>
    <p class="t-links"><a class="t-ext" href="https://gitee.com/caoqu" target="_blank" rel="noopener">gitee.com/caoqu ↗</a></p>
    <p class="t-dim">工作里那套客服与工单的 AI 系统不在这里贴图——内部系统，截图和数据都不外传。</p>
  </template>

  <template id="sec-works">
    <h2 class="t-h2">作品。<span>都是真的在跑的。</span></h2>
    <p class="t-lead">四个自己写、自己部署、自己每天在用的项目。截图来自真实运行界面，录屏是当场录的。</p>
    <dl class="t-cols">
      <dt><button type="button" class="t-cmd" data-cmd="open flow-studio">flow-studio</button></dt>
      <dd>Agent 与工作流编排画布</dd>
      <dt><button type="button" class="t-cmd" data-cmd="open meitu-web">meitu-web</button></dt>
      <dd>浏览器本地跑的图像处理</dd>
      <dt><button type="button" class="t-cmd" data-cmd="open vibe-works">vibe-works</button></dt>
      <dd>标准库撑起来的作品社区</dd>
      <dt><button type="button" class="t-cmd" data-cmd="open kid-earth">kid-earth</button></dt>
      <dd>给 4 岁孩子做的全栈启蒙站</dd>
    </dl>
  </template>

  <template id="proj-flow-studio">
    <h2 class="t-h2">Flow Studio<span>Python · FastAPI · 零构建画布</span></h2>
    <p class="t-lead">拖拽画布编排 Agent 与工作流。意图节点先分流，条件节点做分支，LLM 节点在没有 key 时自动降级成规则而不阻断整条流程——所以图里这条「应聘助手」开箱就能跑完。</p>
    <figure class="t-shot" data-video="assets/work-flow.mp4">
      <img src="assets/work-flow.jpg" alt="Flow Studio 工作流画布：左侧是 21 种节点面板，中间连出三条意图支路，右侧是流程设置表单" loading="lazy" />
      <figcaption>录屏当场录制 · 框内静音循环，点开可放大并开声音</figcaption>
    </figure>
    <ul class="t-ul">
      <li><b>21 种节点</b><span>LLM / Agent / 意图 / 条件 / 模板 / HTTP / 知识库 / 记忆 / 技能 / MCP / 分镜视频</span></li>
      <li><b>一句话触发</b><span>外部主 agent 调 <code>/api/agent/chat</code> 即可路由到整条流程</span></li>
      <li><b>223 个 pytest 用例</b><span>覆盖引擎防环、降级与整套 API</span></li>
    </ul>
    <p class="t-run"><b>$</b> pytest --collect-only -q<em>223 tests collected in 0.21s</em></p>
  </template>

  <template id="proj-meitu-web">
    <h2 class="t-h2">美图工坊<span>纯静态 · WebGL · 无后端</span></h2>
    <p class="t-lead">20 种滤镜、美颜、调参、裁剪、马赛克、贴纸、文字、涂鸦，全部在浏览器本地跑完——图片不出这台设备，服务器只负责把这几个文件发给你。</p>
    <figure class="t-shot is-phone" data-video="assets/work-meitu.mp4">
      <img src="assets/work-meitu.jpg" alt="美图工坊移动端：底部滤镜条当前选中「日系」，工具栏有滤镜、美颜、调参、马赛克、贴纸、文字、涂鸦、裁剪" loading="lazy" />
      <figcaption>移动端竖屏 · 框内静音循环，点开可放大并开声音</figcaption>
    </figure>
    <ul class="t-ul">
      <li><b>一条着色器管线</b><span>滤镜、美颜、调参跑在 warp → blur → color 三段上</span></li>
      <li><b>导出走 toBlob</b><span>从打开到存图没有一次网络上传</span></li>
    </ul>
    <p class="t-run"><b>$</b> grep -c "id: '" js/filters.js<em>21（20 种滤镜 + 原图）</em></p>
  </template>

  <template id="proj-vibe-works">
    <h2 class="t-h2">Vibe馆<span>Python 标准库 · 社区 · 审核流</span></h2>
    <p class="t-lead">vibe coding 作品社区：输入咒语时右侧实时长出作品卡预览，投稿进审核队列，详情页按图文自动交替排版。后端只用标准库，数据存一个 JSON 文件。</p>
    <figure class="t-shot">
      <img src="assets/work-vibe.jpg" alt="Vibe馆 首页：一句话造一个东西，左侧咒语输入框，右侧实时生成三张作品卡预览" loading="lazy" />
      <figcaption>真实运行界面 · 点图放大</figcaption>
    </figure>
    <ul class="t-ul">
      <li><b>无封面也不空</b><span>不传封面时按咒语生成一张 aura 渐变卡</span></li>
      <li><b>自动排版</b><span>每件作品最多带 12 个系统页面，图左图右自动轮转</span></li>
    </ul>
    <p class="t-run"><b>$</b> wc -l server.py storage.py<em>774 total · 零第三方依赖</em></p>
  </template>

  <template id="proj-kid-earth">
    <h2 class="t-h2">小小地球侦探队<span>Next.js · three.js · SQLite</span></h2>
    <p class="t-lead">给 4 岁孩子做的：不用认字也能玩。看场景动画、点大图案、答对了放庆祝动效；学习线之外还长出一套 three.js 小游戏模式。六套课程从「大海晒太阳」讲到「揭秘地球」。</p>
    <figure class="t-shot">
      <img src="assets/work-kid.jpg" alt="小小地球侦探队 答题闯关：线索抽屉里一道三个大图案选项的题目，右侧是家长陪玩提示" loading="lazy" />
      <figcaption>真实运行界面 · 点图放大</figcaption>
    </figure>
    <ul class="t-ul">
      <li><b>内容进库，C 端读快照</b><span>课程、章节、发布状态进 SQLite，运营后台改完 C 端读已发布快照</span></li>
      <li><b>苏格拉底式题目</b><span>先看线索、再猜现象、最后说理由</span></li>
    </ul>
    <p class="t-run"><b>$</b> sqlite3 app.db "select count(*) from course_chapters"<em>39 章节 / 6 套已发布课程</em></p>
  </template>
